<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>PintaPro · Presupuestos de pintura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>PintaPro</h1>
      <p>Pinturas Decodl SL · Presupuestos rápidos</p>
    </div>
    <button id="newBtn" class="secondary">Nuevo</button>
  </header>

  <main>
    <section class="card">
      <h2>Datos del cliente</h2>
      <div class="grid">
        <label>Cliente<input id="cliente" placeholder="Nombre del cliente"></label>
        <label>Teléfono<input id="telefono" inputmode="tel" placeholder="Teléfono"></label>
        <label class="wide">Dirección<input id="direccion" placeholder="Dirección de la obra"></label>
      </div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>Trabajos</h2>
        <button id="addBtn">+ Añadir trabajo</button>
      </div>
      <div id="items"></div>
    </section>

    <section class="card">
      <h2>Desplazamiento</h2>
      <div class="grid">
        <label>Distancia (km)<input id="km" type="number" min="0" step="1" value="0"></label>
        <label>Importe desplazamiento (€)<input id="desplazamiento" type="number" min="0" step="0.01" value="0"></label>
      </div>
      <p class="hint">A partir de 50 km puedes añadir el coste por tiempo/desplazamiento.</p>
    </section>

    <section class="card total-card">
      <div><span>Subtotal</span><strong id="subtotal">0,00 €</strong></div>
      <div><span>Desplazamiento</span><strong id="travelTotal">0,00 €</strong></div>
      <div class="grand"><span>TOTAL</span><strong id="total">0,00 €</strong></div>
    </section>

    <section class="card">
      <label>Observaciones<textarea id="notas" rows="4" placeholder="Materiales, preparación, condiciones, etc."></textarea></label>
      <div class="actions">
        <button id="printBtn">Imprimir / Guardar PDF</button>
        <button id="shareBtn" class="secondary">Compartir resumen</button>
      </div>
    </section>
  </main>

  <template id="itemTemplate">
    <div class="item">
      <div class="grid item-grid">
        <label class="wide">Trabajo
          <select class="concepto">
            <option>Pintura paredes/techos</option>
            <option>Alisado / preparación</option>
            <option>Pintura de puertas</option>
            <option>Rodapié / moldura</option>
            <option>Otro</option>
          </select>
        </label>
        <label>Cantidad<input class="cantidad" type="number" min="0" step="0.01" value="0"></label>
        <label>Unidad
          <select class="unidad">
            <option>m²</option>
            <option>ml</option>
            <option>ud</option>
          </select>
        </label>
        <label>Precio unitario (€)<input class="precio" type="number" min="0" step="0.01" value="0"></label>
        <label>Importe<input class="importe" readonly value="0,00 €"></label>
      </div>
      <button class="remove danger">Eliminar</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
